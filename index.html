<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- Reveal.js Base -->
    <link rel="stylesheet" href="styles/vendor/reset.min.css">
    <link rel="stylesheet" href="styles/vendor/reveal.min.css">
    <link rel="stylesheet" id="theme">
    <!-- Custom Styles (version managed by js/styles.js) -->
    <link rel="stylesheet" href="style.css?v=2">
    <!-- Module Preloads for ESM optimization -->
    <link rel="modulepreload" href="js/main.js">
    <link rel="modulepreload" href="js/theme.js">
    <link rel="modulepreload" href="js/slides.js">
    <link rel="modulepreload" href="js/config.js">
    <link rel="modulepreload" href="js/layouts.js">
    <link rel="modulepreload" href="js/styles.js">
    <link rel="modulepreload" href="js/ui.js">
    <link rel="modulepreload" href="js/animation.js">
    <link rel="modulepreload" href="js/timer.js">
    <link rel="modulepreload" href="js/tabs.js">
    <!-- Marked.js for dynamic markdown parsing -->
    <script src="js/vendor/marked.min.js" defer></script>
</head>
<body>
    <!-- Premium Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-logo-wrapper">
                <span class="loading-logo-text">Lectura</span>
                <span class="loading-logo-sub">by AditDinus</span>
            </div>
            <div class="loading-spinner-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-status">MEMUAT CACHE SISTEM...</div>
        </div>
    </div>

    <div class="reveal">
        <!-- LaTeX Style Header & Footer -->
        <div class="header" style="display: none;">
            <div class="nav-tabs" id="book-tabs">
            </div>
            <div class="header-right-controls">
                <div id="presentation-timer" class="timer-container">
                    <button id="start-timer"></button>
                    <button id="reset-timer"></button>
                    <span id="timer-display"></span>
                </div>
                <div class="accessibility-container">
                    <button id="accessibility-toggle" title="Accessibility Menu (A)" aria-expanded="false">
                        <span class="accessibility-icon"></span>
                    </button>
                    <div id="accessibility-menu" class="accessibility-menu">
                        <button id="laser-toggle" title="Toggle Laser Pointer (L)" aria-pressed="false">
                            <span class="laser-icon"></span>
                        </button>
                        <button id="scribble-toggle" title="Toggle Scribble Mode (S)" aria-pressed="false">
                            <span class="scribble-icon"></span>
                        </button>
                        <button id="scribble-clear" title="Clear All Scribbles (Ctrl+K)" style="display: none;">
                            <span class="clear-icon"></span>
                        </button>
                        <button id="theme-toggle" title="Toggle Dark/Light Mode">
                            <span class="theme-icon"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer" style="display: none;">
            <div class="left-info">
                <span class="watermark">Lectura by AditDinus 🔥</span>
            </div>
            <div class="center-info"></div>
            <div class="right-info">
                <span class="slide-number"></span>
            </div>
        </div>

        <div class="navigation-controls">
            <button id="prev-btn" title="Previous Slide (←)"></button>
            <button id="next-btn" title="Next Slide (→)"></button>
        </div>

        <div class="slides">
            <!-- Dynamic content will be loaded here from content.md -->
            <section>
                <h2>Loading Presentation...</h2>
            </section>
        </div>
    </div>

    <!-- Image Preview Overlay -->
    <div class="image-preview-overlay" id="image-preview" style="display: none;">
        <span class="image-preview-close" id="image-preview-close">&times;</span>
        <img src="" alt="Preview" id="image-preview-img">
    </div>
    <canvas id="scribble-canvas" class="scribble-canvas"></canvas>
    <div id="laser-cursor" class="laser-pointer"></div>
    <!-- Reveal.js Scripts -->
    <script src="js/vendor/reveal.min.js" defer></script>
    <script src="js/vendor/math.min.js" defer></script>

    <!-- Modular ES Module Entry Point -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
